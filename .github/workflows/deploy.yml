name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, stage, prod]
        required: true
      starter_ref:
        description: Full commit SHA of sotream/nest-next-starter to build and deploy
        type: string
        required: true
      force_restart:
        description: Restart the services after the rollout (needed after rotating credentials, because ECS reads secrets at task start)
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The GitHub Environment holds the deploy role ARN and, for stage and prod, the required reviewers.
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      TF_IN_AUTOMATION: 'true'
      TF_VAR_region: ${{ vars.AWS_REGION || 'eu-central-1' }}
      TF_VAR_domain_name: ${{ vars[format('DOMAIN_NAME_{0}', inputs.environment)] }}
      TF_VAR_hosted_zone_id: ${{ vars[format('HOSTED_ZONE_ID_{0}', inputs.environment)] }}
      TF_VAR_alarm_email: ${{ vars[format('ALARM_EMAIL_{0}', inputs.environment)] }}
      TF_VAR_credentials_version: ${{ vars.CREDENTIALS_VERSION || 1 }}
      TF_VAR_jwt_version: ${{ vars.JWT_VERSION || 1 }}
      TF_VAR_permissions_boundary_arn: ${{ vars.PERMISSIONS_BOUNDARY_ARN }}
      STARTER_REF: ${{ inputs.starter_ref }}
    steps:
      - name: Validate the starter ref
        run: |
          if ! [[ "$STARTER_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::starter_ref must be a full 40-character commit SHA, not a branch or tag name."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: ./.github/actions/terraform-init
        with:
          environment: ${{ inputs.environment }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          region: ${{ vars.AWS_REGION || 'eu-central-1' }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}

      # 1. Infrastructure. Services stay on the image they run now; on the first deployment that is none.
      - name: Apply infrastructure
        working-directory: envs/${{ inputs.environment }}
        run: |
          set -euo pipefail
          # Ask ECS what runs now rather than trusting a Terraform output, which survives a failed rollout.
          CURRENT=$("$GITHUB_WORKSPACE/scripts/current-image-tag.sh" "nnat-$ENVIRONMENT" "nnat-$ENVIRONMENT-api")
          echo "CURRENT=$CURRENT" >> "$GITHUB_ENV"
          terraform apply -input=false -auto-approve -lock-timeout=300s \
            -var "services_image_tag=$CURRENT" -var "migrate_image_tag=$CURRENT" -var "starter_ref=$STARTER_REF"

      # 2. Build from the pinned starter commit and push. Tags are immutable, so an existing tag is reused.
      - uses: actions/checkout@v7
        with:
          repository: sotream/nest-next-starter
          ref: ${{ inputs.starter_ref }}
          path: starter

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        working-directory: envs/${{ inputs.environment }}
        run: |
          set -euo pipefail
          ORIGIN=$(terraform output -raw public_origin)
          # The web image inlines the origin at build time and ECR tags are immutable, so the tag includes a
          # hash of the origin: the same commit deployed under a new domain builds a new image.
          TAG="${STARTER_REF::12}-$(printf %s "$ORIGIN" | sha256sum | cut -c1-8)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          API_REPO=$(terraform output -json ecr_repository_urls | jq -r .api)
          WEB_REPO=$(terraform output -json ecr_repository_urls | jq -r .web)
          exists() { aws ecr describe-images --repository-name "$1" --image-ids imageTag="$TAG" >/dev/null 2>&1; }
          API_NAME=${API_REPO#*/}
          WEB_NAME=${WEB_REPO#*/}
          if exists "$API_NAME"; then echo "api:$TAG already in ECR"; else
            docker build -f ../../starter/apps/api/Dockerfile -t "$API_REPO:$TAG" ../../starter
            docker push "$API_REPO:$TAG"
          fi
          if exists "$WEB_NAME"; then echo "web:$TAG already in ECR"; else
            # NEXT_PUBLIC_API_URL is inlined at build time: it is the same origin that serves the web app.
            docker build -f ../../starter/apps/web/Dockerfile --build-arg "NEXT_PUBLIC_API_URL=$ORIGIN" \
              -t "$WEB_REPO:$TAG" ../../starter
            docker push "$WEB_REPO:$TAG"
          fi

      # 3. Register the migration task, run it once and require a clean exit before any service changes.
      - name: Migrate
        working-directory: envs/${{ inputs.environment }}
        run: |
          set -euo pipefail
          terraform apply -input=false -auto-approve -lock-timeout=300s \
            -var "services_image_tag=$CURRENT" -var "migrate_image_tag=$TAG" -var "starter_ref=$STARTER_REF"
          CLUSTER=$(terraform output -raw cluster_name)
          TASK_DEF=$(terraform output -raw migrate_task_definition_arn)
          SUBNETS=$(terraform output -json private_subnet_ids | jq -r 'join(",")')
          SG=$(terraform output -raw migrate_security_group_id)
          TASK_ARN=$(aws ecs run-task --cluster "$CLUSTER" --launch-type FARGATE --task-definition "$TASK_DEF" \
            --count 1 --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].stoppedReason' --output text
            echo "::error::Migration exited with code $EXIT_CODE. Services were not updated. Logs: /nnat-$ENVIRONMENT/migrate"
            exit 1
          fi

      # 4. Roll the services. The apply waits for a steady state; the ECS circuit breaker rolls back a bad rollout.
      - name: Roll out services
        working-directory: envs/${{ inputs.environment }}
        run: |
          terraform apply -input=false -auto-approve -lock-timeout=300s \
            -var "services_image_tag=$TAG" -var "migrate_image_tag=$TAG" -var "starter_ref=$STARTER_REF"

      # Secrets are read when a task starts. After raising credentials_version or jwt_version the task
      # definition is unchanged, so the rollout above starts nothing; restart on request.
      - name: Restart services
        if: inputs.force_restart
        working-directory: envs/${{ inputs.environment }}
        run: |
          set -euo pipefail
          CLUSTER=$(terraform output -raw cluster_name)
          for svc in api web; do
            aws ecs update-service --cluster "$CLUSTER" --service "$CLUSTER-$svc" --force-new-deployment >/dev/null
          done
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$CLUSTER-api" "$CLUSTER-web"

      # 5. Smoke test through the public origin.
      - name: Smoke test
        working-directory: envs/${{ inputs.environment }}
        run: |
          set -euo pipefail
          ORIGIN=$(terraform output -raw public_origin)
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "$ORIGIN/api/health/ready"
          curl --fail --silent --show-error --retry 5 --retry-delay 6 --retry-all-errors "$ORIGIN/sign-in" > /dev/null
